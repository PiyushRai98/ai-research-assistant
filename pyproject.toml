[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "Production-grade AI Research Assistant with Retrieval Augmented Generation and citations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Research Assistant Team" }]
keywords = ["rag", "llm", "research", "fastapi", "streamlit", "faiss"]

# NOTE: Heavy ML dependencies (torch, faiss, sentence-transformers, langchain)
# are declared here for production installs. The codebase is designed so that
# these imports are lazy/pluggable, allowing the domain and application layers
# to be unit-tested without downloading multi-gigabyte models.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "loguru>=0.7",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "tenacity>=8.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Machine-learning runtime. Kept separate so CI and unit tests stay fast.
ml = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
]
# Streamlit presentation layer.
ui = [
    "streamlit>=1.36",
]
# Development, linting, and testing toolchain.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[project.scripts]
research-assistant-api = "app.backend.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: pep8-naming, UP: pyupgrade,
# B: bugbear, C4: comprehensions, SIM: simplify, ARG: unused args, PTH: pathlib.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802", "N803"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests spanning multiple components",
    "ml: tests requiring heavy ML dependencies",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/frontend/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
