[tool.poetry]
name = "ai-research-assistant"
version = "0.1.0"
description = "Production-grade AI Research Assistant with Retrieval Augmented Generation and citations."
authors = ["AI Research Assistant Team"]
readme = "README.md"
license = "MIT"
package-mode = false  # Critical: don't try to install as a package

[tool.poetry.dependencies]
python = ">=3.12,<3.13"  # Specify max version for compatibility
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
loguru = "^0.7.0"
PyMuPDF = "^1.24.0"
numpy = "^1.26.0"
tenacity = "^8.4.0"
python-dotenv = "^1.0.0"
sentence-transformers = "^3.0.0"
faiss-cpu = "^1.8.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
langchain-text-splitters = "^0.2.0"
streamlit = "^1.36.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.5.0"
black = "^24.4.0"
pre-commit = "^3.7.0"
mypy = "^1.10.0"

[tool.poetry.scripts]
research-assistant-api = "app.backend.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Reuse your existing tool configurations
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802", "N803"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests spanning multiple components",
    "ml: tests requiring heavy ML dependencies",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/frontend/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]